name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install OpenSSL development dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config ipmitool
      - name: Install OpenSSL development dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 pkg-config
      - name: Install pinned MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.20+65efd5b93'
      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Initialize Mooncakes index
        run: moon update
      - run: moon fmt --check
      - run: moon check --target native --deny-warn
      - run: moon test --target native --deny-warn
      - run: moon build --target native --deny-warn
      - run: moon run examples/offline --target native
      - run: python3 tools/interop.py _build/native/debug/build/examples/loopback/loopback.exe
      - name: Set up Go for the reference interoperability check
        if: runner.os == 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: tools/go-reference/go.sum
      - name: Build pinned go-ipmi validation adapters
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: local
        run: |
          go -C tools/go-reference build -mod=readonly -o ../../_build/reference-bmc .
          go -C tools/go-reference build -mod=readonly -o ../../_build/reference-client ./client
      - name: Compare three clients against one synthetic BMC
        if: runner.os == 'Linux'
        run: python3 tools/compare_clients.py --moon-client _build/native/debug/build/examples/comparison/comparison.exe --go-client _build/reference-client --output _build/client-comparison.json
      - name: Compare reads and command limits against the go-ipmi BMC
        if: runner.os == 'Linux'
        run: python3 tools/go_interop.py _build/native/debug/build/examples/comparison/comparison.exe _build/reference-bmc --compare-reads
      - name: Compare requester tolerance and retained checks with ipmitool
        if: runner.os == 'Linux'
        run: python3 tools/address_check.py --moon-client _build/native/debug/build/examples/comparison/comparison.exe --output _build/address-comparison.json
      - name: Observe ipmitool response-address compatibility
        if: runner.os == 'Linux'
        run: python3 tools/go_interop.py "$(command -v ipmitool)" _build/reference-bmc --ipmitool-address-probe
      - run: moon info
      - run: git diff --exit-code

name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install OpenSSL development dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config autoconf automake libtool
      - name: Install OpenSSL development dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 pkg-config autoconf automake libtool
      - name: Check out the fixed unpatched ipmitool reference
        uses: actions/checkout@v5
        with:
          repository: ipmitool/ipmitool
          ref: 19d78782d795d0cf4ceefe655f616210c9143e62
          path: _build/ipmitool-source
          persist-credentials: false
      - name: Build and fingerprint the reference profile
        run: python3 tools/reference_build.py --source _build/ipmitool-source --output _build/ipmitool-reference
      - name: Record reference dispatch and argument-error leaves
        run: python3 tools/reference_cases.py --reference-profile _build/ipmitool-reference/profile.json --output _build/reference-cases.json
      - name: Install pinned MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.20+65efd5b93'
      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Initialize Mooncakes index
        run: moon update
      - run: moon fmt --check
      - run: moon check --target native --deny-warn
      - run: moon test --target native --deny-warn
      - run: moon build --target native --deny-warn
      - run: moon run examples/offline --target native
      - run: python3 tools/interop.py _build/native/debug/build/examples/loopback/loopback.exe
      - name: Set up Go for the reference interoperability check
        if: runner.os == 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: tools/go-reference/go.sum
      - name: Build pinned go-ipmi validation adapters
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: local
        run: |
          go -C tools/go-reference build -mod=readonly -o ../../_build/reference-bmc .
          go -C tools/go-reference build -mod=readonly -o ../../_build/reference-client ./client
      - name: Compare three clients against one synthetic BMC
        if: runner.os == 'Linux'
        run: python3 tools/compare_clients.py --reference-profile _build/ipmitool-reference/profile.json --moon-client _build/native/debug/build/examples/comparison/comparison.exe --go-client _build/reference-client --output _build/client-comparison.json
      - name: Compare SDR-backed readings with ipmitool sdr and sensor
        if: runner.os == 'Linux'
        run: python3 tools/sdr_check.py --reference-profile _build/ipmitool-reference/profile.json --moon-client _build/native/debug/build/examples/sdr/sdr.exe --output _build/sdr-comparison.json
      - name: Compare bounded chassis FRU and SEL diagnostics with ipmitool
        run: python3 tools/diagnostics_check.py --reference-profile _build/ipmitool-reference/profile.json --moon-client _build/native/debug/build/examples/diagnostics/diagnostics.exe --output _build/diagnostics-comparison.json
      - name: Compare management status reads with ipmitool
        run: python3 tools/management_check.py --reference-profile _build/ipmitool-reference/profile.json --moon-client _build/native/debug/build/examples/diagnostics/diagnostics.exe --output _build/management-comparison.json
      - name: Compare GUID and System Info reads with ipmitool
        run: python3 tools/identity_check.py --reference-profile _build/ipmitool-reference/profile.json --moon-client _build/native/debug/build/examples/diagnostics/diagnostics.exe --output _build/identity-comparison.json
      - name: Compare channel reads with ipmitool
        run: python3 tools/channel_check.py --reference-profile _build/ipmitool-reference/profile.json --moon-client _build/native/debug/build/examples/diagnostics/diagnostics.exe --output _build/channel-comparison.json
      - name: Compare user reads with ipmitool
        run: python3 tools/user_check.py --reference-profile _build/ipmitool-reference/profile.json --moon-client _build/native/debug/build/examples/diagnostics/diagnostics.exe --output _build/user-comparison.json
      - name: Compare reads and command limits against the go-ipmi BMC
        if: runner.os == 'Linux'
        run: python3 tools/go_interop.py _build/native/debug/build/examples/comparison/comparison.exe _build/reference-bmc --compare-reads --reference-profile _build/ipmitool-reference/profile.json
      - name: Compare requester tolerance and retained checks with ipmitool
        if: runner.os == 'Linux'
        run: python3 tools/address_check.py --reference-profile _build/ipmitool-reference/profile.json --moon-client _build/native/debug/build/examples/comparison/comparison.exe --output _build/address-comparison.json
      - name: Observe ipmitool response-address compatibility
        if: runner.os == 'Linux'
        run: python3 tools/go_interop.py _build/ipmitool-reference/source/src/ipmitool _build/reference-bmc --ipmitool-address-probe --reference-profile _build/ipmitool-reference/profile.json
      - run: moon info
      - run: git diff --exit-code
      - name: Retain reference and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipmitool-parity-${{ matrix.os }}
          path: |
            _build/ipmitool-reference/profile.json
            _build/ipmitool-reference/source/config.h
            _build/ipmitool-reference/source/src/ipmitool
            _build/ipmitool-reference/source/src/ipmievd
            _build/ipmitool-reference/data/enterprise-numbers
            _build/ipmitool-reference/build-*.log
            _build/*-comparison.json
            _build/reference-cases.json
